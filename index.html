<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<title>Control OLMS</title>
<style>
:root{
  --pearl:#f7f3e8;--pearl2:#fffdf8;--ink:#111;--muted:#746d61;--gold:#c9a227;--gold2:#ead995;
  --line:#ddd3bd;--green:#2e9b57;--red:#d64545;--orange:#e88932;--blue:#3976d2;--purple:#8056b3;--gray:#817b71;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--pearl);color:var(--ink)}
body:before{content:"♪   ♫   ♪   ♫   ♪   ♫   ♪   ♫";position:fixed;inset:-20px;pointer-events:none;opacity:.022;font-size:62px;line-height:160px;letter-spacing:30px;overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;background:rgba(247,243,232,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}.logo{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#111;color:var(--gold);border:2px solid var(--gold);font-weight:900}.brand small{display:block;color:var(--muted);font-size:11px}
main{padding:14px 10px 100px;max-width:1180px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,253,248,.98);border-top:1px solid var(--line);padding-bottom:max(4px,env(safe-area-inset-bottom))}
nav button{border:0;background:transparent;padding:7px 2px 9px;color:#5d574e;font-size:10px}
nav button b{display:block;font-size:19px;margin-bottom:2px}nav button.active{background:#111;color:#fff}
.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800}.primary{background:#111;color:#fff}.ghost{background:#efe9dc;color:#111}.danger{background:var(--red);color:#fff}.success{background:var(--green);color:#fff}.small{padding:7px 9px;font-size:12px}
.iconbtn{border:1px solid var(--line);background:var(--pearl2);border-radius:10px;width:38px;height:38px}
.fab{position:fixed;right:14px;bottom:72px;width:56px;height:56px;border-radius:50%;border:0;background:#111;color:#fff;font-size:26px;z-index:31;box-shadow:0 8px 25px #0003}
.toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}.muted{color:var(--muted)}h1,h2,h3{margin:0 0 6px}
.segment{display:flex;background:#ece6d8;padding:4px;border-radius:12px}.segment button{border:0;background:transparent;border-radius:9px;padding:8px 10px;font-weight:800;color:#5f594e}.segment button.active{background:#fff;color:#111;box-shadow:0 2px 8px #0001}
.period{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.period select,.period button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi{border:1px solid var(--line);border-radius:15px;padding:13px;background:var(--pearl2);text-align:left}.kpi span{display:block;font-size:11px;text-transform:uppercase;font-weight:800;color:var(--muted)}.kpi strong{display:block;font-size:21px;margin-top:5px}.kpi.gold{background:#c9a22718}.kpi.green{background:#2e9b5715}.kpi.orange{background:#e8893215}.kpi.red{background:#d6454515}.kpi.blue{background:#3976d215}.kpi.purple{background:#8056b315}
.card{background:var(--pearl2);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:9px}.activity{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:9px;align-items:center}.date{background:#111;color:#fff;border-radius:10px;text-align:center;padding:6px 3px}.date b{display:block;font-size:17px}.date small{color:#dfc45f}.activity .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity .main div{font-size:12px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900;white-space:nowrap}.paid{background:#2e9b5718;color:#22733e}.pending{background:#e8893218;color:#9a5718}.partial{background:#8056b318;color:#64468d}.overdue{background:#d6454518;color:#a52f2f}.future{background:#c9a22722;color:#735e18}.free{background:#3976d215;color:#2d5da4}.gray{background:#7772;color:#625f58}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-size:11px;font-weight:800;color:#534d43}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;min-height:40px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px;border-bottom:1px solid #eee7d7;text-align:left;font-size:12px}th{background:#f0eadc}
dialog{border:0;border-radius:18px;width:min(760px,95vw);max-height:92vh;padding:0;background:var(--pearl2)}dialog::backdrop{background:#0007;backdrop-filter:blur(2px)}.dlg{padding:15px;overflow:auto;max-height:92vh}.close{float:right}
.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tabs button{border:0;background:#eee8dc;border-radius:999px;padding:7px 9px;white-space:nowrap;font-weight:800}.tabs button.active{background:#111;color:#fff}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info .box{background:#f0eadc;border-radius:11px;padding:10px}.info .box small{display:block;color:var(--muted)}.info .box b{display:block;margin-top:3px}
.trip{border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:10px}.triphead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}
.transportrow{display:grid;grid-template-columns:34px minmax(110px,1fr) 90px auto;gap:6px;align-items:center;margin:6px 0}.ticon{width:32px;height:32px;border-radius:9px;background:#eee8dc;display:grid;place-items:center}.transportrow select,.transportrow input,.extrarow select,.extrarow input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;min-width:0}.mini{border:0;background:#eee8dc;border-radius:8px;width:30px;height:30px}
.extrarow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(110px,1fr) 90px auto;gap:6px;align-items:center;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dayhead{text-align:center;font-size:11px;font-weight:900;color:var(--muted)}.day{min-height:78px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px}.day .n{font-weight:900;font-size:11px}.ev{display:block;width:100%;border:0;border-radius:5px;background:#dbadff66;font-size:9px;padding:3px;margin-top:3px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed #cabf9f;border-radius:13px;padding:22px;text-align:center;color:var(--muted);background:#ffffff70}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:999px;z-index:100;display:none;box-shadow:0 8px 20px #0004;white-space:nowrap}
.sectionline{margin:14px 0 8px;border-top:1px solid var(--line);padding-top:12px}
a.btn{text-decoration:none;display:inline-block}
@media(min-width:900px){nav{position:fixed;left:0;top:63px;bottom:0;right:auto;width:205px;display:flex;flex-direction:column;padding:10px}nav button{text-align:left;border-radius:10px;font-size:13px;padding:10px}nav button b{display:inline;margin-right:8px}.fab{right:24px;bottom:24px}main{padding-left:225px;padding-bottom:35px}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.grid2,.grid3,.info{grid-template-columns:1fr}.activity{grid-template-columns:50px minmax(0,1fr)}.activity>.badge{grid-column:2}.transportrow{grid-template-columns:32px 1fr 86px}.transportrow .actions{grid-column:2/-1;justify-self:end}.extrarow{grid-template-columns:1fr 1fr 82px}.extrarow .actions{grid-column:2/-1;justify-self:end}.cal{gap:2px}.day{min-height:67px}.ev{font-size:8px}}

.ticon{overflow:hidden;padding:0;background:#e6e7e9;border:1px solid #d2d4d8}
.ticon img{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px}
.transport-picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}
.transport-choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px;text-align:center;font-size:11px;font-weight:800;color:#27231e}
.transport-choice img{width:64px;height:64px;object-fit:cover;border-radius:13px;display:block;margin:0 auto 6px}
.personal-extra{grid-column:2/-1;display:grid;grid-template-columns:1fr;gap:4px}
.personal-extra input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;width:100%}
.transport-preview{display:flex;align-items:center;gap:10px}
.transport-preview img{width:54px;height:54px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
@media(max-width:560px){.transport-picker{grid-template-columns:repeat(2,minmax(0,1fr))}}


.header-actions{display:flex;gap:7px;align-items:center}.bellbtn{position:relative}.notif-badge{position:absolute;right:-3px;top:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#d64545;color:white;font-size:10px;font-weight:900;display:grid;place-items:center}.notif-badge.hidden{display:none}
.confirm{background:#d9a62122;color:#8a6811}.notice{border:1px solid var(--line);border-radius:13px;padding:10px;margin:8px 0;background:#fff}.notice b{display:block}.notice small{display:block;color:var(--muted);margin-top:3px}.notice-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.post-actions{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}.post-actions .btn{width:100%}.native-state{font-weight:800}


.profile-card{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.profile-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #c9a227;background:#ece9df}
.profile-avatar.fallback{display:grid;place-items:center;font-size:30px;font-weight:900;color:#c9a227;background:#111}
.profile-meta h3{margin:0 0 3px}.profile-meta .muted{overflow-wrap:anywhere}
.profile-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.profile-edit{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
@media(max-width:430px){.profile-card{grid-template-columns:70px 1fr}.profile-avatar{width:70px;height:70px}}

/* ===== Control OLMS v6 experience ===== */
.splash-screen{position:fixed;inset:0;z-index:9999;background:#f7f3e8;display:grid;place-items:center;overflow:hidden;transition:opacity .22s ease,visibility .22s ease}.splash-screen.hide{opacity:0;visibility:hidden}.splash-notes{position:absolute;inset:-5%;font-size:clamp(54px,11vw,120px);line-height:1.9;letter-spacing:22px;word-spacing:22px;color:#090909;opacity:.14;transform:rotate(-8deg);user-select:none}.splash-inner{position:relative;z-index:2;text-align:center;padding:28px}.splash-logo{width:min(48vw,220px);aspect-ratio:1;object-fit:cover;border-radius:28%;box-shadow:0 18px 45px #0002}.splash-inner h1{margin:20px 0 5px;font-size:30px}.splash-inner p{margin:0;color:#635d52}.splash-loader{width:44px;height:44px;border:5px solid #d8d0be;border-top-color:var(--gold);border-radius:50%;margin:22px auto 0;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.today-shell{min-height:calc(100dvh - 142px);margin:-14px -10px 18px;padding:18px 14px 22px;background:radial-gradient(circle at 82% 18%,#9b6a142b 0 12%,transparent 34%),linear-gradient(145deg,#080808,#12110e 56%,#050505);color:#fff;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}.today-shell:after{content:"♫";position:absolute;right:-10px;top:90px;font-size:190px;color:#d9ae3b0d;transform:rotate(-12deg);pointer-events:none}.today-heading{position:relative;z-index:1}.today-heading small{color:#e4c56c;font-weight:900;text-transform:uppercase;letter-spacing:.13em}.today-heading h1{font-size:34px;line-height:1.02;margin:6px 0 2px}.today-heading h1 span{display:block;font-size:25px;color:#fff;font-weight:650}.live-card{position:relative;z-index:1;border:1px solid #d0a33b66;background:linear-gradient(150deg,#1b1812,#080808);border-radius:22px;padding:18px;box-shadow:0 18px 38px #0006}.live-card .event-kind{display:inline-flex;background:#c9a22722;border:1px solid #c9a22755;color:#f1cf6d;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900}.live-title{font-size:26px;margin:12px 0 10px;line-height:1.05}.live-meta{display:grid;gap:7px;color:#eee}.live-meta span{display:flex;gap:8px;align-items:flex-start}.nav-main{width:100%;background:linear-gradient(135deg,#e3b746,#c89527);color:#0a0a0a;border:0;border-radius:15px;padding:14px;font-weight:950;font-size:17px;margin-top:15px}.live-progress{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.live-step{border:1px solid #ffffff22;background:#ffffff0b;color:#b8b8b8;border-radius:14px;padding:11px 6px;font-weight:850}.live-step.active{background:#d6a52f;color:#080808;border-color:#e9c05c}.live-step.done{background:#ffffff15;color:#f2d376}.live-finance{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.live-money{background:#ffffff0d;border:1px solid #ffffff18;border-radius:15px;padding:12px 8px;text-align:center}.live-money small{display:block;color:#aaa;font-size:10px;text-transform:uppercase}.live-money strong{display:block;margin-top:4px;font-size:19px}.live-money.net strong{color:#55ce79}.live-expenses{position:relative;z-index:1;margin-top:auto}.live-expenses h3{margin-bottom:9px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick-expense{border:1px solid #ffffff20;background:#ffffff0d;color:#fff;border-radius:16px;padding:14px 8px;font-weight:850}.quick-expense b{font-size:21px;display:block;margin-bottom:4px}.expense-running{font-size:12px;color:#c7c7c7;margin-top:10px}.next-capsule{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;padding:12px 13px;margin-bottom:13px;background:linear-gradient(145deg,#fffdf8,#f0e8d8);border:1px solid var(--line);border-radius:17px;box-shadow:0 7px 22px #6a55220d}.next-capsule .next-icon{width:46px;height:46px;border-radius:13px;background:#111;color:#d8ad37;display:grid;place-items:center;font-size:22px}.next-capsule h3{font-size:17px;line-height:1.05;margin:0}.next-capsule h3 span{display:block;font-size:14px;font-weight:650;margin-top:2px}.next-capsule p{margin:5px 0 0;font-size:11px;color:var(--muted)}.next-capsule .arrow{font-size:24px;color:#8a8172}.dash-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:10px}.dash-title h2{font-size:25px}.kpi{transition:transform .15s ease,box-shadow .15s ease}.kpi:active,.card:active,.quick-expense:active{transform:scale(.985)}.kpi strong{letter-spacing:-.02em}.place-card{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px;margin:8px 0}.place-card .chev{font-size:20px;color:#8b8376}.place-metrics{font-size:11px;color:var(--muted);margin-top:3px}.location-review{border:1px solid #e0ab3a;background:#fff7dc;border-radius:13px;padding:11px;margin-bottom:12px}.quick-sheet h2{margin-bottom:4px}.choice-pills{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.choice-pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:800}.choice-pill.active{background:#111;color:#fff}.amount-box{font-size:27px;font-weight:900;text-align:center}.recent-amounts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.recent-amounts button{border:1px solid var(--line);background:#f3eee2;border-radius:999px;padding:8px 11px;font-weight:800}.nav-options{display:grid;gap:10px;margin-top:14px}.nav-options a{text-decoration:none;text-align:center;padding:15px;border-radius:14px;font-weight:900}.nav-options .maps{background:#111;color:#fff}.nav-options .uber{background:#eee9dc;color:#111}.close-sheet{position:absolute;right:15px;top:15px}.closeout{margin-top:12px;border-top:1px solid #ffffff1b;padding-top:12px}.closeout-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.closeout-grid div{background:#ffffff0b;border-radius:10px;padding:9px}.closeout-grid small{display:block;color:#aaa}.today-shell .badge{background:#d3a53422;color:#f0c95d}.profit-note{margin-top:8px;font-size:11px;color:#cfcfcf}.profit-warn{color:#ffd56e;font-weight:850}
@media(min-width:900px){.today-shell{border-radius:24px;margin:0 0 20px;min-height:720px}.quick-grid{grid-template-columns:repeat(4,1fr)}.live-card{max-width:760px}.today-shell>*{max-width:860px;width:100%;margin-left:auto;margin-right:auto}}

</style>
</head>
<body>
<div id="splash" class="splash-screen" aria-label="Bienvenida a Control OLMS">
  <div class="splash-notes" aria-hidden="true">♪ ♫ ♩ ♬ ♪ ♫ ♩ ♬</div>
  <div class="splash-inner">
    <img src="mambito-logo.png" class="splash-logo" alt="La Mambito Sound">
    <h1>Bienvenido</h1>
    <p>Cargando sistema...</p>
    <div class="splash-loader"><span></span></div>
  </div>
</div>
<header>
  <div class="brand"><div class="logo">OL</div><div><b>Control OLMS</b><small>La Mambito Sound · v6.1</small></div></div>
  <div class="header-actions">
  <button class="iconbtn bellbtn" onclick="openNotifications()" aria-label="Notificaciones">🔔<span id="notifBadge" class="notif-badge hidden">0</span></button>
  <button class="iconbtn" onclick="calendarQuickAction()" aria-label="Sincronizar Google Calendar">↻</button>
</div>
</header>

<main>
<section id="dashboard"></section>
<section id="activities" class="hidden"></section>
<section id="calendar" class="hidden"></section>
<section id="payments" class="hidden"></section>
<section id="more" class="hidden"></section>
</main>

<nav>
<button class="active" data-view="dashboard"><b>⌂</b>Inicio</button>
<button data-view="activities"><b>🎤</b>Actividades</button>
<button data-view="calendar"><b>▦</b>Calendario</button>
<button data-view="payments"><b>💰</b>Pagos</button>
<button data-view="more"><b>☰</b>Más</button>
</nav>
<button class="fab" onclick="openActivityForm()">＋</button>

<dialog id="activityDlg">
<div class="dlg">
<button class="iconbtn close" onclick="activityDlg.close()">✕</button>
<h2 id="activityTitle">Nueva actividad</h2>
<input id="aid" type="hidden">
<div class="grid2">
  <div class="field"><label>Clase</label><select id="akind">
    <option value="presentacion">Presentación / toque</option><option value="ensayo">Ensayo</option><option value="viaje">Viaje</option><option value="grabacion">Grabación</option><option value="promocion">Promoción</option>
  </select></div>
  <div class="field"><label>Tipo</label><select id="atype"></select></div>
</div>
<div class="field"><label>Título</label><input id="atitle"></div>
<div class="grid2"><div class="field"><label>Lugar</label><input id="avenue" list="venueList"><datalist id="venueList"><option value="Tacos La Neta"><option value="Tropicana Salsa Club"><option value="Casa de Russo"><option value="Green Village"><option value="Hotel Central"></datalist></div><div class="field"><label>Provincia</label><input id="aprovince"></div></div>
<div class="field"><label>Dirección</label><input id="alocation"></div>
<div class="grid3">
  <div class="field"><label>Fecha</label><input id="adate" type="date"></div>
  <div class="field"><label>Inicio</label><input id="astart" type="time"></div>
  <div class="field"><label>Fin</label><input id="aend" type="time"></div>
</div>
<div class="grid2">
  <div class="field"><label>Monto esperado</label><input id="aexpected" type="number" min="0" step=".01"></div>
  <div class="field"><label>Monto final acordado</label><input id="afinal" type="number" min="0" step=".01"></div>
</div>
<div class="field"><label><input id="afree" type="checkbox"> Actividad gratis / sin remuneración</label></div>
<div class="grid2">
  <div class="field"><label>Regla de pago</label><input id="apaymentrule" placeholder="Ej. Hasta 7 días"></div>
  <div class="field"><label>Fecha estimada de pago</label><input id="aduepreview" readonly placeholder="Se calcula automáticamente"></div>
</div>
<div class="field"><label>Estado</label><select id="aoutcome">
<option value="">Pendiente / futura</option><option value="realizado">Realizado</option><option value="asisti">Asistí</option><option value="no-participe">No participé</option><option value="no-asisti">No asistí</option><option value="cancelado">Cancelado</option>
</select></div>
<div class="field"><label>Observación</label><textarea id="anotes" rows="2"></textarea></div>
<div class="row"><button class="btn ghost" onclick="activityDlg.close()">Cancelar</button><button class="btn primary" onclick="saveActivity()">Guardar</button></div>
</div>
</dialog>

<dialog id="detailDlg"><div class="dlg" id="detailBody"></div></dialog>
<dialog id="transportDlg"><div class="dlg">
<button class="iconbtn close" onclick="transportDlg.close()">✕</button>
<h2>Seleccionar transporte</h2>
<p class="muted">Usa las imágenes que seleccionaste para identificar rápidamente cada medio.</p>
<div id="transportPicker" class="transport-picker"></div>
</div></dialog>

function calendarTitle(a){

function nightBeforeReminderMinutes(a){

function parseGoogleEvent(ev){
 const st=ev.start?.dateTime||"",en=ev.end?.dateTime||"",sum=ev.summary||"";let kind="presentacion",type="Otro",venue=(ev.location||"").split(",")[0]||"";
 if(sum.startsWith("🎵"))kind="ensayo";else if(sum.startsWith("✈️"))kind="viaje";else if(sum.startsWith("🎙️"))kind="grabacion";else if(sum.startsWith("📣"))kind="promocion";
 if(sum.includes("Presentación Mambito Sound")){let tail=sum.split("Presentación Mambito Sound").pop().replace(/^\s*[–-]\s*/,"");let parts=tail.split("|").map(x=>x.trim());type=parts[0]||"Otro";venue=parts[1]||venue}
 else if(sum.includes("Ensayo Mambito Sound")){type="Ensayo regular";let parts=sum.split("|");venue=(parts[1]||venue).trim()}
 else if(sum.includes("|")){type=sum.split("|").pop().trim()||type}
 const loc=ev.location||"";
 return{calendarEventId:ev.id,kind,type,title:type==="Otro"?(venue||"Actividad"):type,venue,location:loc,province:loc.toLowerCase().includes("panamá oeste")?"Panamá Oeste":loc.toLowerCase().includes("panamá")?"Panamá":"",date:st.slice(0,10),start:st.slice(11,16)||"00:00",end:en.slice(11,16)||"23:59",notes:"",free:kind==="ensayo",outcome:"",payments:[],expenses:{outbound:[],return:[],extras:[]},source:"calendar"}
}
async function syncCalendar(){
 if(!googleAccessToken)return toast("Conecta Google primero");
 try{
   const since=new Date(Date.now()-365*86400000).toISOString();
   const url="https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&timeMin="+encodeURIComponent(since)+"&maxResults=250&q="+encodeURIComponent("Mambito Sound");
   const d=await gfetch(url),found=new Set();
   for(const ev of (d.items||[])){
     found.add(ev.id);const p=parseGoogleEvent(ev);let a=state.activities.find(x=>x.calendarEventId===ev.id);
     if(!a)a=state.activities.find(x=>!x.calendarEventId&&x.date===p.date&&x.start===p.start);
     if(!a){const near=state.activities.find(x=>!x.calendarEventId&&x.date===p.date&&(x.venue===p.venue||x.type===p.type)&&Math.abs(eventStartTime(x)-eventStartTime(p))<=90*60000);if(near&&confirm(`Calendar encontró una actividad que podría ser la misma:\n${near.title} · ${near.start}\n${p.type} · ${p.start}\n\n¿Vincularlas?`))a=near}
     if(a){
       const future=!a.outcome&&activityEndTime(a)>new Date();const before={date:a.date,start:a.start,end:a.end};
       a.calendarEventId=ev.id;a.source="calendar";a.kind=p.kind;a.type=p.type;a.deletedFromCalendar=false;
       if(future){a.date=p.date;a.start=p.start;a.end=p.end}
       if(p.location&&p.location!==(a.location||"")){a.pendingCalendarLocation=p.location;a.pendingCalendarVenue=p.venue;addAlert("📍 Ubicación cambiada en Calendar",`${a.title}: revisa la nueva ubicación antes de aplicarla.`,`cal-location-${ev.id}-${p.location}`)}
       if(future&&(before.date!==a.date||before.start!==a.start||before.end!==a.end))addAlert("📅 Fecha u horario actualizado",`${a.title}: Google Calendar actualizó fecha u horario.`,`cal-time-${ev.id}-${a.date}-${a.start}`);
     }else{
       let kp=placeConfig(p.venue);p.expected=p.free?0:(kp?.rate??(p.province==="Panamá Oeste"?40:50));p.final=p.expected;p.paymentRule=kp?.rule||"Hasta 7 días";p.expenseReviewDone=false;p.expensePromptAnswered=false;p.liveStage="";p.paidFullAdjusted=false;
       state.activities.push({...p,id:uid()});addAlert("📅 Nuevo evento de Calendar",`${calendarTitle(p)} · ${panamaDateTime(p.date,p.start)}`,`cal-new-${ev.id}`)
     }
   }
   state.activities.filter(a=>a.calendarEventId).forEach(a=>{if(!found.has(a.calendarEventId)&&!a.deletedFromCalendar){a.deletedFromCalendar=true;addAlert("🗑️ Eliminado de Google Calendar",`${a.title} ya no aparece en Google Calendar.`,`cal-del-${a.calendarEventId}`)}});
   state.settings.lastCalendarSync=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));render();toast(`Calendar sincronizado: ${(d.items||[]).length} eventos`);maybePromptPostActivity();maybeFireNativeNotifications()
 }catch(e){console.error(e);toast("No se pudo sincronizar Google Calendar")}
}

 if(!a)return;
 const rehearsal=a.kind==="ensayo";
 $("postActivityBody").innerHTML=`<h2>${rehearsal?"🎵 ¿Asististe al ensayo?":"🎤 ¿Participaste en la actividad?"}</h2>
 <p><b>${a.title}</b></p><p class="muted">${panamaDate(a.date)} · ${panamaRange(a)} · ${a.venue||"Lugar pendiente"}</p>
 <div class="post-actions">
   <button class="btn primary" onclick="confirmPostOutcome('${a.id}','${rehearsal?"asisti":"realizado"}')">${rehearsal?"✅ Sí, asistí":"✅ Sí, participé"}</button>
   <button class="btn ghost" onclick="confirmPostOutcome('${a.id}','${rehearsal?"no-asisti":"no-participe"}')">${rehearsal?"❌ No asistí":"❌ No participé"}</button>
   <button class="btn danger" onclick="confirmPostOutcome('${a.id}','cancelado')">🚫 Se canceló</button>
   <button class="btn ghost" onclick="snoozePostPrompt('${a.id}')">Recordarme después</button>
 </div>`;
 postActivityDlg.showModal()
}
function snoozePostPrompt(id){
 const a=state.activities.find(x=>x.id===id);if(a)a.postPromptSnoozedUntil=new Date(Date.now()+3*3600000).toISOString();
 localStorage.setItem(KEY,JSON.stringify(state));postActivityDlg.close();render()
}
function confirmPostOutcome(id,outcome){
 const a=state.activities.find(x=>x.id===id);if(!a)return;
 a.outcome=outcome;a.postPromptSnoozedUntil=null;
 if(["realizado","asisti"].includes(outcome)){a.expenseReviewDone=false;a.expensePromptAnswered=false}
 else {a.expenseReviewDone=true;a.expensePromptAnswered=true}
 localStorage.setItem(KEY,JSON.stringify(state));render();
 if(["realizado","asisti"].includes(outcome))showExpenseQuestion(id);else{postActivityDlg.close();setTimeout(maybePromptPostActivity,250)}
}
function showExpenseQuestion(id){
 const a=state.activities.find(x=>x.id===id);if(!a)return;
 $("postActivityBody").innerHTML=`<h2>💸 Gastos de la actividad</h2><p><b>${a.title}</b></p>
 <p class="muted">¿Pagaste transporte, comida, hospedaje u otro gasto?</p>
 <div class="post-actions">
  <button class="btn primary" onclick="expenseDecision('${id}','register')">Sí, registrar gastos ahora</button>
  <button class="btn ghost" onclick="expenseDecision('${id}','none')">No tuve gastos</button>
  <button class="btn ghost" onclick="expenseDecision('${id}','later')">Lo completaré después</button>
 </div>`;
 if(!postActivityDlg.open)postActivityDlg.showModal()
}
function expenseDecision(id,choice){
 const a=state.activities.find(x=>x.id===id);if(!a)return;
 a.expensePromptAnswered=true;
 if(choice==="none")a.expenseReviewDone=true;
 if(choice==="register"||choice==="later")a.expenseReviewDone=false;
 localStorage.setItem(KEY,JSON.stringify(state));render();postActivityDlg.close();
 if(choice==="register")openDetail(id,"expenses");
 else setTimeout(maybePromptPostActivity,250)
}
function nativeReminderCandidates(){
 const out=[];
 state.activities.forEach(a=>{
   if(needsConfirmation(a))out.push({tag:`post-${a.id}`,title:"Control OLMS",body:`${a.title} terminó. Confirma si participaste.`});
   if(done(a)&&!a.expenseReviewDone)out.push({tag:`expense-${a.id}`,title:"Control OLMS · gastos",body:`Completa los gastos de ${a.title}.`});
   if(done(a)&&!a.free&&balance(a)>0){
     const d=due(a);if(!d)return;const diff=daysBetween(d,todayISO());
     if(diff===1)out.push({tag:`pay-tom-${a.id}-${d}`,title:"Control OLMS · cobro mañana",body:`${a.title}: ${money(balance(a))} pendiente.`});
     if(diff===0)out.push({tag:`pay-today-${a.id}-${d}`,title:"Control OLMS · cobro hoy",body:`${a.title}: ${money(balance(a))} pendiente.`});
     const past=-diff;if(past===1||(past>1&&(past-1)%7===0))out.push({tag:`pay-over-${a.id}-${d}-${past}`,title:"Control OLMS · pago vencido",body:`${a.title}: ${money(balance(a))} pendiente.`});
   }
 });
 return out;
}
async function maybeFireNativeNotifications(force=false){
 if(!("Notification" in window)||Notification.permission!=="granted")return;
 const today=todayISO(),seen=state.settings.notifiedTags||{};
 for(const n of nativeReminderCandidates()){
   const key=`${today}|${n.tag}`;
   if(force||!seen[key]){await nativeNotify(n.title,n.body,n.tag);seen[key]=true}
 }
 state.settings.notifiedTags=seen;
 Object.keys(seen).forEach(k=>{if(k.slice(0,10)<new Date(Date.now()-35*86400000).toISOString().slice(0,10))delete seen[k]});
 localStorage.setItem(KEY,JSON.stringify(state));
}



function setLiveStage(id,stage){
 const a=state.activities.find(x=>x.id===id);if(!a)return;a.liveStage=stage;save();
 if(stage==="ended")showImmediatePostActivity(id)
}
function showImmediatePostActivity(id){
 const a=state.activities.find(x=>x.id===id);if(!a)return;const rehearsal=a.kind==="ensayo";
 $("postActivityBody").innerHTML=`<h2>${rehearsal?"🎵 ¿Asististe al ensayo?":"🎤 ¿Participaste en la actividad?"}</h2><p><b>${esc(a.title)}</b></p><div class="post-actions"><button class="btn primary" onclick="confirmPostOutcome('${a.id}','${rehearsal?"asisti":"realizado"}')">${rehearsal?"✅ Sí, asistí":"✅ Sí, participé"}</button><button class="btn ghost" onclick="confirmPostOutcome('${a.id}','${rehearsal?"no-asisti":"no-participe"}')">${rehearsal?"❌ No asistí":"❌ No participé"}</button><button class="btn danger" onclick="confirmPostOutcome('${a.id}','cancelado')">🚫 Se canceló</button><button class="btn ghost" onclick="postActivityDlg.close()">Cerrar por ahora</button></div>`;if(!postActivityDlg.open)postActivityDlg.showModal()
}
function openNavigate(id){
 const a=state.activities.find(x=>x.id===id);if(!a)return;const d=encodeURIComponent(a.location||a.venue||"");
 $("navBody").innerHTML=`<button class="iconbtn close close-sheet" onclick="navDlg.close()">✕</button><h2>📍 Navegar</h2><p class="muted">Elige cómo quieres abrir la ruta hacia ${esc(a.venue||"la actividad")}.</p><div class="nav-options"><a class="maps" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${d}">Google Maps</a><a class="uber" target="_blank" href="https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[formatted_address]=${d}">Uber</a></div>`;navDlg.showModal()
}
let quickExpenseState=null;
function recentAmounts(a,category,subtype="",transport=""){
 const vals=[];state.activities.slice().sort((x,y)=>y.date.localeCompare(x.date)).forEach(x=>{
   if(category==="Transporte"){[...(x.expenses?.outbound||[]),...(x.expenses?.return||[])].forEach(e=>{if(e.amount!=null&&(!transport||e.type===transport))vals.push(Number(e.amount))})}
   else (x.expenses?.extras||[]).forEach(e=>{if(e.amount!=null&&e.category===category&&(!subtype||e.subtype===subtype))vals.push(Number(e.amount))})
 });return [...new Set(vals)].slice(0,4)
}
function habitualTransport(a,side){const counts={};state.activities.filter(x=>x.venue===a.venue).forEach(x=>(x.expenses?.[side]||[]).forEach(t=>counts[t.type]=(counts[t.type]||0)+1));return Object.entries(counts).sort((x,y)=>y[1]-x[1])[0]?.[0]||"uber"}
function openQuickExpense(id,category){const a=state.activities.find(x=>x.id===id),side=(a?.liveStage==="ended"||done(a))?"return":"outbound";quickExpenseState={id,category,subtype:category==="Comida"?"Cena":category==="Hospedaje"?"Noches":"",transport:a?habitualTransport(a,side):"uber",side};renderQuickExpense()}
function renderQuickExpense(){
 const q=quickExpenseState,a=state.activities.find(x=>x.id===q.id);if(!a)return;let choices="",extra="";
 if(q.category==="Comida")choices=`<div class="choice-pills">${FOOD.map(x=>`<button class="choice-pill ${q.subtype===x?"active":""}" onclick="quickExpenseState.subtype='${x}';renderQuickExpense()">${x}</button>`).join("")}</div>`;
 if(q.category==="Hospedaje")choices=`<div class="choice-pills"><button class="choice-pill ${q.subtype==="Horas"?"active":""}" onclick="quickExpenseState.subtype='Horas';renderQuickExpense()">Horas</button><button class="choice-pill ${q.subtype==="Noches"?"active":""}" onclick="quickExpenseState.subtype='Noches';renderQuickExpense()">Noches</button></div>`;
 if(q.category==="Transporte"){
   if(!q.side)q.side=(a.liveStage==="ended"||done(a))?"return":"outbound";
   choices=`<div class="choice-pills"><button class="choice-pill ${q.side==="outbound"?"active":""}" onclick="quickExpenseState.side='outbound';renderQuickExpense()">Ida</button><button class="choice-pill ${q.side==="return"?"active":""}" onclick="quickExpenseState.side='return';renderQuickExpense()">Regreso</button></div><div class="transport-picker">${TRANSPORTS.map(x=>`<button class="transport-choice ${q.transport===x[0]?"active":""}" onclick="quickExpenseState.transport='${x[0]}';renderQuickExpense()"><img src="${transportIcon(x[0])}" alt="${x[1]}"><span>${x[1]}</span></button>`).join("")}</div>`
 }
 if(q.category==="Otro")extra=`<div class="field"><label>Detalle</label><input id="quickDetail" placeholder="Ej. Vestuario, entrada, propina..."></div>`;
 const recent=recentAmounts(a,q.category,q.subtype,q.transport);
 $("quickExpenseBody").innerHTML=`<div class="quick-sheet"><button class="iconbtn close" onclick="quickExpenseDlg.close()">✕</button><h2>${q.category==="Transporte"?"🚗":q.category==="Comida"?"🍽️":q.category==="Hospedaje"?"🏨":"＋"} ${q.category}</h2><p class="muted">${esc(a.title)} · gasto real de hoy</p>${choices}${extra}<div class="field"><label>Monto</label><input id="quickAmount" class="amount-box" type="number" inputmode="decimal" step=".01" min="0" placeholder="B/. 0.00"></div>${recent.length?`<div><small class="muted">Importes usados recientemente</small><div class="recent-amounts">${recent.map(v=>`<button onclick="$('quickAmount').value='${v.toFixed(2)}'">${money(v)}</button>`).join("")}</div></div>`:""}<div class="row" style="margin-top:15px"><button class="btn primary" onclick="saveQuickExpense()">Guardar gasto</button><button class="btn ghost" onclick="quickExpenseDlg.close()">Cancelar</button></div></div>`;if(!quickExpenseDlg.open)quickExpenseDlg.showModal()
}
function saveQuickExpense(){
 const q=quickExpenseState,a=state.activities.find(x=>x.id===q.id);if(!a)return;const amount=Number($("quickAmount").value||0);if(!amount&&$("quickAmount").value!=="0")return toast("Escribe el monto del gasto");
 const projected=expTotal(a)+amount;if(finalAmt(a)>0&&projected>=finalAmt(a)*.5&&!confirm(`⚠️ Con este gasto ya habrás consumido al menos la mitad de lo acordado para este evento.\n\n¿Registrar el gasto de todas formas?`))return;
 if(q.category==="Transporte")a.expenses[q.side].push({id:uid(),type:q.transport,amount,driver:""});
 else a.expenses.extras.push({id:uid(),category:q.category==="Otro"?"Otro":q.category,subtype:q.category==="Otro"?($("quickDetail")?.value||""):q.subtype,amount});
 a.expensePromptAnswered=true;localStorage.setItem(KEY,JSON.stringify(state));quickExpenseDlg.close();render();toast("Gasto agregado")
}
function reviewCalendarLocation(id){
 const a=state.activities.find(x=>x.id===id);if(!a?.pendingCalendarLocation)return;const loc=a.pendingCalendarLocation,venue=a.pendingCalendarVenue||loc.split(",")[0];
 if(!confirm(`Google Calendar cambió la ubicación a:\n${loc}\n\n¿Aplicar esta nueva ubicación en Control OLMS?`))return;
 a.location=loc;if(venue)a.venue=venue;a.pendingCalendarLocation="";a.pendingCalendarVenue="";
 const p=placeConfig(a.venue);if(p&&isUpcoming(a)&&confirm("¿Aplicar también la tarifa y regla de pago habituales del nuevo lugar a esta actividad futura?")){a.expected=p.rate??a.expected;a.final=p.rate??a.final;a.paymentRule=p.rule||a.paymentRule}
 save();if(detailDlg.open)openDetail(id,"summary");toast("Ubicación actualizada")
}
function dismissCalendarLocation(id){const a=state.activities.find(x=>x.id===id);if(!a)return;a.pendingCalendarLocation="";a.pendingCalendarVenue="";save();if(detailDlg.open)openDetail(id,"summary")}

async function maybeAutoCalendarSync(){
 if(!googleAccessToken)return;
 const last=state.settings.lastCalendarSync?new Date(state.settings.lastCalendarSync):null;
 const now=new Date();
 const stale=!last||(now-last)>10*60*1000;
 const afterFive=now.getHours()>=5;
 const notToday=!last||last.toDateString()!==now.toDateString();
 if(stale||(afterFive&&notToday))await syncCalendar();
}

let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e});
async function installApp(){
 if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null}
 else toast("La instalación aparecerá cuando Control OLMS esté publicado en HTTPS")
}
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
function showUndo(msg,fn){undoAction=fn;let t=$("toast");t.innerHTML=`${msg} &nbsp; <button style="border:0;background:transparent;color:#e5c15a;font-weight:900" onclick="undoNow()">DESHACER</button>`;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>{t.style.display="none";undoAction=null},5000)}
function undoNow(){if(undoAction)undoAction();$("toast").style.display="none";undoAction=null}
function toast(msg){let t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",2600)}
function render(){renderDash();renderActivities();renderCalendar();renderPayments();renderMore();renderNotificationBadge()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("main section").forEach(x=>x.classList.add("hidden"));$(b.dataset.view).classList.remove("hidden")});
$("akind").onchange=()=>{
 if($("akind").value==="ensayo"){
   $("atype").value="Ensayo regular";$("avenue").value=state.settings.regularRehearsalPlace;$("alocation").value=state.settings.regularRehearsalLocation;$("aprovince").value="Panamá Oeste";$("afree").checked=true;$("apaymentrule").value="Sin remuneración";plusTwoHours();syncFreeFields()
 }else if($("afree").checked && $("atype").value==="Ensayo regular"){$("afree").checked=false;syncFreeFields()}
};
$("avenue").addEventListener("change",applyKnownPlace);
$("avenue").addEventListener("blur",applyKnownPlace);
$("aprovince").addEventListener("blur",()=>applyRateSuggestion(false));
$("alocation").addEventListener("blur",()=>applyRateSuggestion(false));
$("adate").addEventListener("change",updateDuePreview);
$("apaymentrule").addEventListener("input",updateDuePreview);
$("astart").addEventListener("change",plusTwoHours);
$("aexpected").addEventListener("input",()=>{if(autoFinal)$("afinal").value=$("aexpected").value});
$("afinal").addEventListener("input",()=>{autoFinal=false});
$("afree").addEventListener("change",syncFreeFields);
render();
setTimeout(()=>{const sp=$("splash");if(sp){sp.classList.add("hide");setTimeout(()=>sp.remove(),260)}},1000);
setTimeout(()=>{maybeAutoCalendarSync();maybePromptPostActivity();maybeFireNativeNotifications();},1100);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){render();setTimeout(()=>{maybeAutoCalendarSync();maybePromptPostActivity();maybeFireNativeNotifications();},250)}});
window.addEventListener("focus",()=>{render();setTimeout(()=>{maybeAutoCalendarSync();maybePromptPostActivity();maybeFireNativeNotifications();},250)});
setInterval(()=>{render();maybeAutoCalendarSync();maybePromptPostActivity();maybeFireNativeNotifications();},60000);
</script>
